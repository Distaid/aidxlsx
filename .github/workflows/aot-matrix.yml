# .github/workflows/aot-matrix.yml
# Nightly NativeAOT check on three operating systems: linux-x64, win-x64, osx-arm64.
name: aot-matrix

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-matrix
  cancel-in-progress: false

jobs:
  aot:
    name: aot-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            binary: Aid.Xlsx.AotSmoke
          - os: windows-latest
            rid: win-x64
            binary: Aid.Xlsx.AotSmoke.exe
          - os: macos-latest
            rid: osx-arm64
            binary: Aid.Xlsx.AotSmoke
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: setup-dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: install clang (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: verify command line tools (macos)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
      - name: publish native aot
        run: dotnet publish tests/Aid.Xlsx.AotSmoke/Aid.Xlsx.AotSmoke.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:NuGetLockFilePath=obj/packages.aot.lock.json -o artifacts/aot/${{ matrix.rid }}
      - name: run smoke
        shell: bash
        run: ./artifacts/aot/${{ matrix.rid }}/${{ matrix.binary }}
      - name: record size
        shell: bash
        run: |
          set -euo pipefail
          wc -c < "artifacts/aot/${{ matrix.rid }}/${{ matrix.binary }}" | tr -d ' ' > "artifacts/aot/${{ matrix.rid }}/size.txt"
          cat "artifacts/aot/${{ matrix.rid }}/size.txt"
      - name: upload size
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aot-size-${{ matrix.rid }}
          path: artifacts/aot/${{ matrix.rid }}/size.txt
          if-no-files-found: error
          retention-days: 30
