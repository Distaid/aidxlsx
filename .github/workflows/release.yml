# .github/workflows/release.yml
# Release: the only publication path is pushing a v* tag created by the owner.
# workflow_dispatch (the version input) is a dry run: it builds, tests and packs but does not publish,
# does not create a tag and does not create a Release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry run: the version from Directory.Build.props, for example 1.0.0 (nothing is published)'
        required: true
        type: string

permissions:
  contents: read

# One release at a time: a static group, no expressions and no unsupported functions.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  PACKAGE_ID: Aid.Xlsx

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      major_minor: ${{ steps.derive.outputs.major_minor }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: derive version
        id: derive
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prefix=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n 1)
          suffix=$(sed -n 's:.*<VersionSuffix>\([^<]*\)</VersionSuffix>.*:\1:p' Directory.Build.props | head -n 1)
          if [ -z "$prefix" ]; then
            echo "::error::Directory.Build.props has no VersionPrefix"
            exit 1
          fi
          expected="$prefix"
          if [ -n "$suffix" ]; then expected="$prefix-$suffix"; fi

          if [ "${{ github.event_name }}" == "push" ]; then
            # publication: the tag was created and pushed by the owner (the only publication trigger)
            tag="${GITHUB_REF_NAME}"
            case "$tag" in
              v*) ;;
              *) echo "::error::the tag must start with v: $tag"; exit 1 ;;
            esac
            version="${tag#v}"
            ref_sha="$(git rev-parse HEAD)"
          else
            # dry run: by definition there is no tag, the input version is validated separately
            version="$REQUESTED_VERSION"
            ref_sha="$GITHUB_SHA"
            tag="v$version"
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview[1-9][0-9]*)?$ ]]; then
            echo '::error::version must use MAJOR.MINOR.PATCH with an optional -previewN suffix'
            exit 1
          fi
          if [ "$expected" != "$version" ]; then
            echo "::error::Directory.Build.props gives '$expected' but the run requested '$version'. Land a version bump PR first."
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          # 1) The commit being released must be on main, both for a tag push and for a dry run.
          if ! git merge-base --is-ancestor "$ref_sha" refs/remotes/origin/main; then
            echo "::error::commit $ref_sha is not on main"
            exit 1
          fi

          # 2a) Tag ancestry is checked ONLY in the push branch.
          if [ "${{ github.event_name }}" == "push" ]; then
            if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" refs/remotes/origin/main; then
              echo "::error::tag $tag is not reachable from the main branch"
              exit 1
            fi
          else
            # 2b) dry run: never touch refs/tags (git would exit 128), check that the tag does not exist.
            existing_tag=$(git tag --list "$tag")
            if [ -n "$existing_tag" ]; then
              echo "::error::tag $tag already exists: a dry run must target a version that does not exist yet"
              exit 1
            fi
          fi

          if printf '%s' "$version" | grep -q -- '-'; then prerelease=true; else prerelease=false; fi
          major_minor=$(printf '%s' "$prefix" | cut -d. -f1,2)

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "major_minor=$major_minor"
          } >> "$GITHUB_OUTPUT"
          echo "version: $version (prerelease=$prerelease, tag=$tag, event=${{ github.event_name }})"

  ci:
    name: ci
    needs: [version]
    uses: ./.github/workflows/ci.yml

  aot-matrix:
    name: aot-${{ matrix.rid }}
    needs: [version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            binary: Aid.Xlsx.AotSmoke
          - os: windows-latest
            rid: win-x64
            binary: Aid.Xlsx.AotSmoke.exe
          - os: macos-latest
            rid: osx-arm64
            binary: Aid.Xlsx.AotSmoke
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: setup-dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: install clang (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version
      - name: verify command line tools (macos)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p || sudo xcode-select --install
          clang --version
      - name: verify MSVC toolset (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop -property installationPath
          & $vswhere -latest -property catalog_productDisplayVersion
      - name: publish native aot
        run: dotnet publish tests/Aid.Xlsx.AotSmoke/Aid.Xlsx.AotSmoke.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} -p:PublishAot=true -p:NuGetLockFilePath=obj/packages.${{ matrix.rid }}.lock.json -o artifacts/aot/${{ matrix.rid }}
      - name: run smoke
        shell: bash
        run: ./artifacts/aot/${{ matrix.rid }}/${{ matrix.binary }}
      - name: record size
        shell: bash
        run: |
          set -euo pipefail
          wc -c < "artifacts/aot/${{ matrix.rid }}/${{ matrix.binary }}" | tr -d ' ' > "artifacts/aot/${{ matrix.rid }}/size.txt"
          cat "artifacts/aot/${{ matrix.rid }}/size.txt"
      - name: upload size
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aot-size-${{ matrix.rid }}
          path: artifacts/aot/${{ matrix.rid }}/size.txt
          if-no-files-found: error
          retention-days: 90

  pack:
    name: pack
    needs: [version, ci, aot-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      package-artifact-id: ${{ steps.upload-packages.outputs.artifact-id }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: setup-dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: restore
        run: dotnet restore Aid.Xlsx.slnx
      - name: pack
        run: dotnet pack src/Aid.Xlsx/Aid.Xlsx.csproj -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true -p:Deterministic=true -o artifacts/packages
      - name: verify package identity
        shell: bash
        run: |
          set -euo pipefail
          expected_version='${{ needs.version.outputs.version }}'
          found=0
          for f in artifacts/packages/*.nupkg; do
            case "$f" in
              *".$expected_version.nupkg") found=1 ;;
              *) echo "::error::package file name does not match the released version: $f"; exit 1 ;;
            esac
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::no package found for version $expected_version"
            exit 1
          fi
      - name: generate dependency SBOM
        shell: bash
        env:
          DOTNET_CLI_UI_LANGUAGE: en-US
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet tool install CycloneDX --version 6.3.2 --tool-path artifacts/tools/cyclonedx
          # Polyfill supplies build-time source and is absent from the NuGet dependency graph.
          artifacts/tools/cyclonedx/dotnet-CycloneDX src/Aid.Xlsx/Aid.Xlsx.csproj \
            --framework net10.0 --disable-package-restore --exclude-dev --exclude-filter Polyfill \
            --output-format Json --output artifacts/packages --filename Aid.Xlsx.cdx.json \
            --set-name "$PACKAGE_ID" --set-version "$RELEASE_VERSION" --set-type Library
      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/packages
          sha256sum *.nupkg *.snupkg Aid.Xlsx.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: reproducibility probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Aid.Xlsx/Aid.Xlsx.csproj -c "$CONFIGURATION" --no-restore -p:ContinuousIntegrationBuild=true -p:Deterministic=true -o artifacts/packages-second
          first=$(sha256sum artifacts/packages/*.nupkg | awk '{print $1}')
          second=$(sha256sum artifacts/packages-second/*.nupkg | awk '{print $1}')
          echo "pack #1: $first"
          echo "pack #2: $second"
          if [ "$first" = "$second" ]; then
            echo "deterministic pack: .nupkg hashes match"
          else
            echo "::warning::.nupkg hashes differ on a repeated pack; publication is not blocked"
          fi
      - name: upload packages
        id: upload-packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 30

  # Publication happens only on a push of a tag created by the owner. Dispatch never reaches this job.
  # The main path (Trusted Publishing via OIDC) requires NO secrets at all:
  # NuGet/login@v1 issues a temporary 1-hour key from the OIDC token.
  # The API key below is an optional fallback; its absence breaks nothing.
  publish:
    name: publish-nuget
    needs: [version, pack]
    if: ${{ github.event_name == 'push' && needs.pack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: nuget-production
      url: https://www.nuget.org/packages/Aid.Xlsx/${{ needs.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: download packages
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.package-artifact-id }}
          path: artifacts/packages
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        continue-on-error: true
        with:
          # The value must match the owner of the OIDC policy on nuget.org.
          # A NuGet username is set once and cannot be renamed.
          user: Distaid
      - name: push (Trusted Publishing)
        id: trusted
        if: steps.login.outcome == 'success'
        continue-on-error: true
        env:
          TRUSTED_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TRUSTED_API_KEY:-}" ]; then
            echo "::error::NuGet/login did not return NUGET_API_KEY"
            exit 1
          fi
          for pkg in artifacts/packages/*.nupkg; do
            echo "push $pkg"
            dotnet nuget push "$pkg" \
              --source "$NUGET_SOURCE" \
              --api-key "$TRUSTED_API_KEY" \
              --skip-duplicate \
              --timeout 600
          done
      - name: push (optional fallback scoped key from environment secret)
        if: steps.trusted.outcome != 'success'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::Trusted Publishing failed and no fallback NUGET_API_KEY is configured."
            exit 1
          fi
          for pkg in artifacts/packages/*.nupkg; do
            echo "push $pkg (fallback)"
            dotnet nuget push "$pkg" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate --timeout 600
          done
      - name: summary
        if: always()
        run: |
          echo "### Aid.Xlsx publication" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${{ needs.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: ${{ needs.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- package: https://www.nuget.org/packages/${{ env.PACKAGE_ID }}/${{ needs.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  # The Release works only with an existing tag; tags are created by the owner, CI never creates tags.
  github-release:
    name: github-release
    needs: [version, pack, publish]
    if: ${{ github.event_name == 'push' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: download packages
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.package-artifact-id }}
          path: artifacts/packages
      - name: verify package checksums
        working-directory: artifacts/packages
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: release notes
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { printing = 1; next }
              printing && /^(## \[|\[[^]]+\]:)/ { exit }
              printing { print }
            ' CHANGELOG.md > artifacts/release-notes.md
            if [ ! -s artifacts/release-notes.md ]; then
              awk '
                /^## \[Unreleased\]$/ { printing = 1; next }
                printing && /^(## \[|\[[^]]+\]:)/ { exit }
                printing { print }
              ' CHANGELOG.md > artifacts/release-notes.md
            fi
          fi
          if [ ! -s artifacts/release-notes.md ]; then
            git log -1 --pretty='%s%n%n%b' > artifacts/release-notes.md
          fi
          { echo; echo "**Package:** https://www.nuget.org/packages/${{ env.PACKAGE_ID }}/$version"; } >> artifacts/release-notes.md
          cat artifacts/release-notes.md
      - name: create or update release (existing tag, idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/Aid.Xlsx.cdx.json artifacts/packages/SHA256SUMS.txt)
          prerelease=()
          case "${TAG}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, uploading assets again (--clobber)"
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            # --verify-tag: the tag must already exist; CI never creates it
            gh release create "${TAG}" --title "${TAG}" --notes-file artifacts/release-notes.md --verify-tag "${prerelease[@]}" "${assets[@]}"
          fi

  # dry run: publishes and creates nothing; verifies that the version is not taken by a tag yet.
  dry-run:
    name: dry-run
    needs: [version, pack]
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: download packages
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.package-artifact-id }}
          path: artifacts/packages
      - name: verify package checksums
        working-directory: artifacts/packages
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: verify dry-run preconditions
        shell: bash
        env:
          TARGET_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "dry run for $TARGET_TAG: the build jobs run, publication and the Release are not created."
          if [ -n "$(git tag --list "$TARGET_TAG")" ]; then
            echo "::error::tag $TARGET_TAG already exists: a dry run must target a version that does not exist yet"
            exit 1
          fi
          echo "OK: tag $TARGET_TAG is absent, publication skipped"
          {
            echo "### release dry-run"
            echo "- version: ${{ needs.version.outputs.version }}"
            echo "- tag for the future publication: $TARGET_TAG"
            echo "- publication and GitHub Release skipped (workflow_dispatch)"
          } >> "$GITHUB_STEP_SUMMARY"
