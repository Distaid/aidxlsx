# .github/workflows/fuzz.yml
# Nightly coverage-guided fuzzing of OPC and SpreadsheetML readers.
name: fuzz

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [package, worksheet, styles, mce]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: setup-dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: install fuzz tools
        run: |
          sudo apt-get update
          sudo apt-get install -y afl++
          dotnet tool install --tool-path artifacts/fuzz/tools SharpFuzz.CommandLine --version 2.3.0
      - name: build
        run: dotnet build tests/Aid.Xlsx.Fuzzing -c Release -warnaserror -o artifacts/fuzz/bin
      - name: prepare corpus
        run: dotnet artifacts/fuzz/bin/Aid.Xlsx.Fuzzing.dll --seeds artifacts/fuzz/seeds
      - name: instrument reader assemblies
        run: |
          artifacts/fuzz/tools/sharpfuzz artifacts/fuzz/bin/Aid.Xlsx.Opc.dll
          artifacts/fuzz/tools/sharpfuzz artifacts/fuzz/bin/Aid.Xlsx.dll Aid.Xlsx.SpreadsheetML Aid.Xlsx.Workbooks
      - name: fuzz (15 minutes)
        env:
          TARGET: ${{ matrix.target }}
          AFL_NO_AFFINITY: '1'
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: '1'
          AFL_SKIP_BIN_CHECK: '1'
          AFL_FORKSRV_INIT_TMOUT: '10000'
        run: |
          afl-fuzz -V 900 -m none -t 2000 -i "artifacts/fuzz/seeds/$TARGET" -o artifacts/fuzz/output \
            -- dotnet artifacts/fuzz/bin/Aid.Xlsx.Fuzzing.dll "$TARGET"
          issues=$(find artifacts/fuzz/output -type f \( -path '*/crashes/id:*' -o -path '*/hangs/id:*' \) -print)
          if [ -n "$issues" ]; then
            printf '%s\n' "$issues"
            exit 1
          fi
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            artifacts/fuzz/output/**/crashes/
            artifacts/fuzz/output/**/hangs/
            artifacts/fuzz/output/**/fuzzer_stats
          if-no-files-found: ignore
          retention-days: 30
